<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <include>/etc/fonts/fonts.conf</include>

    <match target="pattern">
        <edit name="family" mode="prepend" binding="strong">
            <string>LXGW WenKai Mono</string>
        </edit>
    </match>
</fontconfig>
